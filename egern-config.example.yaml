# Egern 配置示例：CF-Server-Monitor 服务器详情小组件
# 把 scriptings 与 widgets 两段合并进你的 Egern 主配置文件（或模块文件）即可。

scriptings:
  - generic:
      name: "cf-server-monitor"
      # 把 cf-server-monitor.widget.js 上传到 Gist / 仓库，填 raw 地址
      script_url: "https://example.com/path/to/cf-server-monitor.widget.js"
      timeout: 20

widgets:
  - name: "cf-server-monitor"
    env:
      # 必填：你的 CF-Server-Monitor 站点地址（不要带结尾斜杠和路径）
      API_BASE: "https://status.example.com"
      # 可选：服务器 UUID。留空则自动选取列表中第一台可见服务器
      # 获取方式：浏览器打开站点详情页，地址栏 #/server/<这一段就是 UUID>
      SERVER_ID: ""
      # 可选：刷新间隔（分钟），默认 1
      REFRESH_MINUTES: "1"
      # 可选：离线判定阈值（分钟），默认 5
      ONLINE_THRESHOLD_MIN: "5"
